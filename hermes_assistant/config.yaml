name: Hermes Assistant
version: "1.6.5"
slug: hermes_assistant
description: Hermes AI Agent (NousResearch) with Web UI and setup terminal for Home Assistant
url: https://github.com/nuttaruj/hermes-homeassistant

arch:
  - amd64
  - aarch64

# Pre-built multi-arch images published from CI to GHCR. {arch} is
# substituted by HA Supervisor. If the image is unreachable (e.g. first
# install before the package was set public), Supervisor falls back to
# building locally from Dockerfile + build.yaml — slower but never fails.
image: ghcr.io/nuttaruj/{arch}-hermes-assistant

startup: services
boot: auto
init: false

# HA Ingress: embeds the webui into the HA sidebar.
ingress: true
ingress_port: 8787
panel_title: Hermes Agent
panel_icon: mdi:brain
panel_admin: true

# Auto-inject SUPERVISOR_TOKEN so Hermes can call HA without a user-managed LLA.
homeassistant_api: true
hassio_api: false

# Auto-restart by HA if the WebUI health endpoint stops responding.
watchdog: "tcp://[HOST]:[PORT:8787]/"

# Persistent state lives in /data/hermes (managed by Supervisor).
# /config is the addon's user-editable config dir (claude_credentials.json etc.).
map:
  - addon_config:rw
  - share:rw

# Skip regenerable artifacts from HA backups (~400-600MB saved).
# Agent + webui code mirror lives in /data so updates persist, but the
# venv directories can be rebuilt from the image seed if lost.
backup_exclude:
  - "hermes/agent-code/venv/*"
  - "hermes/agent-code/node_modules/*"
  - "hermes/agent-code/.uv-cache/*"
  - "hermes/webui-app/.venv/*"
  - "hermes/webui-app/__pycache__/*"
  - "hermes/webui/cache/*"
  - "hermes/.cache/*"

# Webui + setup terminal both served via HA Ingress (multiplexed through
# nginx inside the container). Neither is exposed to the LAN. The optional
# LAN port mapping is removed — terminal is reachable only via the Ingress
# panel at <ingress_url>/terminal/.

options:
  # ── COMMON ──────────────────────────────────────────────────────────────
  timezone: "Asia/Bangkok"
  enable_terminal: true

  # ── UPGRADES ────────────────────────────────────────────────────────────
  # When true, run `hermes update` on every container start. Picks up
  # upstream Hermes agent releases without bumping the add-on version.
  # Adds ~30s to boot when an update is available.
  auto_update_agent: false

  # When true, `git pull` hermes-webui on every container start.
  # Pinned to the same branch the image was built from.
  auto_update_webui: false

  # ── INTEGRATIONS ────────────────────────────────────────────────────────
  # When true, register HA Core's MCP Server as a Hermes MCP source
  # automatically (re-rendered on every boot). Requires the "MCP Server"
  # integration enabled in HA: Settings → Devices & Services → Add
  # Integration → "Model Context Protocol".
  auto_configure_mcp: true

  # ── OPTIONAL ────────────────────────────────────────────────────────────
  # Override the auto-injected SUPERVISOR_TOKEN with your own Long-Lived
  # Access Token. Leave empty to use the supervisor proxy (recommended).
  homeassistant_token: ""

  # Entities for Hermes to watch. Empty = none.
  watch_entities: []

schema:
  timezone: str
  enable_terminal: bool
  auto_update_agent: bool
  auto_update_webui: bool
  auto_configure_mcp: bool
  homeassistant_token: password?
  watch_entities:
    - str?
